# Páteční hlášení s tipy na víkendové kolo.
# Čas je v UTC: 06:00 UTC = 08:00 v Česku v létě, 07:00 v zimě.
# Pátek ráno je blíž výkopu než pondělí – stihnou se zranění i čtvrteční poháry.
# Úloha se spouští na strojích GitHubu, tvůj počítač u toho nemusí běžet.

name: Páteční tipy na Telegram

on:
  schedule:
    # GitHub cron často zpozdí nebo přeskočí první pátek po změně souboru.
    # Záložní časy pošlou později, duplicitu hlídá telegram_odeslano.json.
    - cron: "0 6 * * 5"
    - cron: "0 7 * * 5"
    - cron: "0 8 * * 5"
    - cron: "0 9 * * 5"
  workflow_dispatch:

concurrency:
  group: patekni-tipy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  posli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Nainstalovat závislosti
        run: pip install -r requirements.txt

      - name: Spočítat tipy a odeslat
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}
          SEZONA: ${{ secrets.SEZONA }}
          PYTHONUTF8: "1"
          TZ: Europe/Prague
        run: python -u posli_hlaseni.py

      - name: Uložit aktualizovaný log predikcí
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predikce_log.csv telegram_odeslano.json
          git diff --cached --quiet || git commit -m "Aktualizace logu predikcí"
          git push
