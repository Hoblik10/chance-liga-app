# Tipy na víkendové kolo. Běží na strojích GitHubu – tvůj počítač
# u toho nemusí být zapnutý. Schedule čte jen soubor na větvi main.
#
# Soubor má nový název schválně: po přejmenování pondelni-tipy.yml →
# patekni-tipy.yml GitHub založil novou úlohu a páteční cron dnes
# ani jednou nespustil (0 běhů). Nová cesta ho donutí zaregistrovat
# schedule znovu.
#
# Časy jsou v Europe/Prague, mimo celou hodinu – GitHub na :00 často
# job zahodí kvůli zátěži.

name: Telegram tipy

on:
  schedule:
    - cron: "15 8 * * 5"
      timezone: "Europe/Prague"
    - cron: "15 9 * * 5"
      timezone: "Europe/Prague"
    - cron: "15 10 * * 5"
      timezone: "Europe/Prague"
    # Když pátek GitHub přeskočí, sobota ráno to ještě stihne před výkopem.
    - cron: "15 8 * * 6"
      timezone: "Europe/Prague"
  workflow_dispatch:

concurrency:
  group: telegram-tipy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  posli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Nainstalovat závislosti
        run: pip install -r requirements.txt

      - name: Spočítat tipy a odeslat
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}
          SEZONA: ${{ secrets.SEZONA }}
          PYTHONUTF8: "1"
          TZ: Europe/Prague
        run: python -u posli_hlaseni.py

      - name: Uložit aktualizovaný log predikcí
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predikce_log.csv telegram_odeslano.json
          git diff --cached --quiet || git commit -m "Aktualizace logu predikcí"
          git push
